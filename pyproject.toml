[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-verification-lab"
version = "2.0.0"
description = "Reproducible C++ CUDA and PTX compiler verification laboratory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
verifylab = "compilerlab.cli:main"

[tool.setuptools.packages.find]
include = ["compilerlab*"]
